# GENERATED by temper — edit manifest.yaml instead
healthCheckTimeout: 300
startPort: 10001
globalTTL: 1800
captureBuffer: 15                 # request/response capture for the /ui inspector

hooks:
  on_startup:
    preload:
      - "coder"

models:
  "coder":
    name: "Coder"
    cmd: >
      llama-server --host 127.0.0.1 --port ${PORT}
      -m '/temper/artifacts/layouts/coder/dc0bf13d38e973845242c06b8a09ac72b014da701f66e925d2f716ad8a417166/model/coder.gguf'
      --offline
      --no-mmproj
      --jinja
      --parallel 1
      -c 24576
      --ctx-checkpoints 16
      --cache-ram 0
      -fa on
      -ctk q8_0 -ctv q8_0
      -b 512
      -ub 512
      --spec-type draft-mtp
      --spec-draft-n-max 3
      --chat-template-file '/temper/artifacts/layouts/coder/dc0bf13d38e973845242c06b8a09ac72b014da701f66e925d2f716ad8a417166/patches/sharp/template.jinja'
      --reasoning off
    ttl: 7200
  "rerank-0.6b":
    name: "Reranker"
    cmd: >
      llama-server --host 127.0.0.1 --port ${PORT}
      -m '/temper/artifacts/layouts/rerank-0.6b/579042d3daa42d1299b04e528c4d985aaa9046830a46798610b03be8cbe9cd51/model/reranker.gguf'
      --offline
      --no-mmproj
      --reranking
      --parallel 1
      -c 4096
      -fa auto
      -b 256
      -ub 256
      -ngl 0
    ttl: 120

routing:
  router:
    use: group
    settings:
      groups:
        pinned:            # resident coders
          persistent: true
          swap: false
          exclusive: false
          members: ["coder"]
        heavy:              # on-demand members
          swap: true
          exclusive: false
          members: ["rerank-0.6b"]
